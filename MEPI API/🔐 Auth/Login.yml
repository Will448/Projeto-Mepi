info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@mepi.com",
        "password": "123456"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        if (json.token) { bru.setVar('token', json.token); }\r

        test('Login OK', () => expect(res.getStatus()).to.equal(200));"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
