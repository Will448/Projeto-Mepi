info:
  name: Logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/logout"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
