info:
  name: Listar equipamentos
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/equipamentos?status=disponivel"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
