info:
  name: Criar funcionário
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/funcionarios"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nome": "Pedro Oliveira",
        "cpf": "444.555.666-77",
        "email": "pedro@empresa.com",
        "data_admissao": "2026-01-15",
        "salario": 3500.00,
        "cargo_id": 1,
        "status": "ativo"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
