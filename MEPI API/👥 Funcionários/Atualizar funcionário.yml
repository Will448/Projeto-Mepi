info:
  name: Atualizar funcionário
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/funcionarios/1"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "salario": 4000.00,
        "status": "ativo"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
